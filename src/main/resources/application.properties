# ---------------------------------------------------------------------------
# Mercado do Bairro - configuração do servidor
# ---------------------------------------------------------------------------
spring.application.name=supermercado-spring
server.port=8080
# Respostas e mensagens sempre em UTF-8 (acentos e símbolos de moeda)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------------------------------------------------------------------------
# Banco de dados padrão: H2 gravado em arquivo na pasta "dados" do projeto.
# Não precisa instalar nada. Para usar MySQL, rode com o perfil "mysql"
# (ver application-mysql.properties e o README).
# MODE=MySQL deixa o H2 aceitar o mesmo SQL do MySQL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./dados/mercado;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas (schema.sql) e o catálogo (data.sql) ao iniciar
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------------------------------------------------------------------------
# Promoção vigente (padrão Strategy: PoliticaDeDesconto)
#   valor-minimo -> R$ X de desconto a partir de R$ Y
#   percentual   -> N% de desconto em todas as compras
#   nenhuma      -> sem promoção
# ---------------------------------------------------------------------------
mercado.promocao.tipo=valor-minimo
mercado.promocao.valor-minimo=100.00
mercado.promocao.valor-desconto=10.00
mercado.promocao.percentual=10

# ---------------------------------------------------------------------------
# Operador criado automaticamente na primeira execução (se a tabela estiver
# vazia). Troque a senha antes de usar fora do ambiente de estudo.
# ---------------------------------------------------------------------------
mercado.operador.login=operador
mercado.operador.nome=Operador da loja
mercado.operador.senha=mercado123

# Console do H2 em http://localhost:8080/h2-console (só para o operador logado)
# JDBC URL: jdbc:h2:file:./dados/mercado  usuário: sa  senha: (vazia)
spring.h2.console.enabled=true
