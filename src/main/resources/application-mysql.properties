# ---------------------------------------------------------------------------
# Perfil "mysql": usa um servidor MySQL em vez do H2.
# Rodar com: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# No NetBeans: botão direito no projeto > Properties > Actions > Run project >
# Set Properties: spring-boot.run.profiles=mysql (passo a passo no README)
# O banco "mercado_do_bairro" é criado na primeira conexão.
# Informe a senha do usuário root na variável de ambiente MYSQL_SENHA ou aqui.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/mercado_do_bairro?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USUARIO:root}
spring.datasource.password=${MYSQL_SENHA:}

# O console do H2 não faz sentido com MySQL (use o MySQL Workbench)
spring.h2.console.enabled=false
